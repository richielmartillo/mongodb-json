<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Módulo 24 - MongoDB</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="matrix-bg"></div>

  <main class="container">
    <header class="hero">
      <p class="tag">EBAC • Módulo 24</p>

      <p>
        Projeto desenvolvido para praticar documentos JSON, coleções,

    <section class="painel">

        <button onclick="limparResultado()">Limpar tela</button>

    <section class="resultado-area">
      <h2 id="tituloResultado">Resultado</h2>
      <div id="resultado" class="grid"></div>

  <script src="script.js"></script>
